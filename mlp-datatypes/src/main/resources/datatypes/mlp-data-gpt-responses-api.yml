openapi: 3.0.1
info:
  title: Datatypes specification for GPT task type
  version: v0
paths: { }


components:
  schemas:
    ResponsesApiRequest:
      allOf:
        - $ref: "#/components/schemas/CreateModelResponsesApiProperties"
        - $ref: "#/components/schemas/ResponsesApiProperties"
        - type: object
          properties:
            input:
              $ref: "#/components/schemas/ResponsesApiRequestInput"
            include:
              type: array
              items:
                type: string
            parallel_tool_calls:
              type: boolean
            store:
              type: boolean
            stream:
              type: boolean
            background:
              type: boolean
            metadata:
              $ref: "#/components/schemas/Metadata"
          required:
            - model
            - input

    CreateModelResponsesApiProperties:
      allOf:
        - $ref: "#/components/schemas/ModelResponsesApiProperties"

    ResponsesApiRequestInput:
      oneOf:
        - $ref: '#/components/schemas/ResponsesApiRequestTextInput'
        - $ref: '#/components/schemas/ResponsesApiRequestItemsInput'

    ResponsesApiRequestTextInput:
      type: object
      properties:
        value:
          type: string
      required:
        - value

    ResponsesApiRequestItemsInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InputItem"
      required:
        - items

    ModelResponsesApiProperties:
      type: object
      properties:
        temperature:
          type: number
          format: double
        top_p:
          type: number
          format: double
        user:
          type: string
        service_tier:
          $ref: "#/components/schemas/ServiceTier"
    ServiceTier:
      type: string
      enum:
        - auto
        - default
        - flex
    ResponsesApiProperties:
      type: object
      properties:
        previous_response_id:
          type: string
        model:
          type: string
        reasoning:
          $ref: "#/components/schemas/Reasoning"
        max_output_tokens:
          type: integer
        instructions:
          type: string
        text:
          type: object
          properties:
            format:
              $ref: "#/components/schemas/TextResponseFormatConfiguration"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ResponsesApiTool"
        tool_choice:
          $ref: "#/components/schemas/ResponsesApiToolChoice"
        truncation:
          type: string
          enum:
            - auto
            - disabled
          default: disabled


    ResponsesApiToolChoice:
      oneOf:
        - $ref: '#/components/schemas/ResponsesApiToolChoiceEnum'
        - $ref: '#/components/schemas/ResponsesApiToolChoiceFunction'

    ResponsesApiToolChoiceEnum:
      type: string
      enum:
        - none
        - auto
        - required

    ResponsesApiToolChoiceFunction:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
      required:
        - type


    Reasoning:
      type: object
      properties:
        effort:
          $ref: "#/components/schemas/ReasoningEffort"
        summary:
          $ref: "#/components/schemas/ReasoningSummaryType"
    ReasoningEffort:
      type: string
      enum:
        - low
        - medium
        - high
    ReasoningSummaryType:
      type: string
      enum:
        - auto
        - concise
        - detailed

    TextResponseFormatConfiguration:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ResponseFormatType'
      discriminator:
        propertyName: type
        mapping:
          text: "ResponseFormatText"
          json_schema: "TextResponseFormatJsonSchema"
          json_object: "ResponseFormatJsonObject"
    ResponseFormatType:
      type: string
      enum:
        - text
        - json_schema
        - json_object
    TextResponseFormatJsonSchema:
      type: object
      allOf:
        - $ref: '#/components/schemas/TextResponseFormatConfiguration'
        - type: object
          properties:
            description:
              type: string
            name:
              type: string
            schema:
              type: object
            strict:
              type: boolean
          required:
            - type
            - schema
            - name
    ResponseFormatText:
      type: object
      allOf:
        - $ref: '#/components/schemas/TextResponseFormatConfiguration'
        - type: object
          required:
            - type
    ResponseFormatJsonObject:
      type: object
      allOf:
        - $ref: '#/components/schemas/TextResponseFormatConfiguration'
        - type: object
          required:
            - type
    ResponseToolChoiceOptions:
      type: string
      enum:
        - none
        - auto
        - required
    ResponseToolChoiceFunction:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
      required:
        - type



    Annotation:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/AnnotationType'
      discriminator:
        propertyName: type
        mapping:
          file_citation: "FileCitationBody"
          container_file_citation: "ContainerFileCitationBody"
          url_citation: "UrlCitationBody"
          file_path: "FilePath"
    AnnotationType:
      type: string
      enum:
        - file_citation
        - container_file_citation
        - url_citation
        - file_path
    FileCitationBody:
      type: object
      allOf:
        - $ref: '#/components/schemas/Annotation'
        - type: object
          properties:
            file_id:
              type: string
            index:
              type: integer
          required:
            - type
            - file_id
            - index
    ContainerFileCitationBody:
      type: object
      allOf:
        - $ref: '#/components/schemas/Annotation'
        - type: object
          properties:
            container_id:
              type: string
            file_id:
              type: string
            start_index:
              type: integer
            end_index:
              type: integer
          required:
            - type
            - container_id
            - file_id
            - start_index
            - end_index
    UrlCitationBody:
      type: object
      allOf:
        - $ref: '#/components/schemas/Annotation'
        - type: object
          properties:
            url:
              type: string
            start_index:
              type: integer
            end_index:
              type: integer
            title:
              type: string
          required:
            - type
            - url
            - start_index
            - end_index
            - title
    FilePath:
      type: object
      allOf:
        - $ref: '#/components/schemas/Annotation'
        - type: object
          properties:
            file_id:
              type: string
            index:
              type: integer
          required:
            - type
            - file_id
            - index


    InputItem:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/InputItemType'
      discriminator:
        propertyName: type
        mapping:
          message: "MessageInputItem"
          file_search_call: "FileSearchResponsesApiToolCallInputItem"
          computer_call: "ComputerResponsesApiToolCallInputItem"
          computer_call_output: "ComputerCallOutputItemParamInputItem"
          web_search_call: "WebSearchResponsesApiToolCallInputItem"
          function_call: "FunctionResponsesApiToolCallInputItem"
          function_call_output: "FunctionCallOutputItemParamInputItem"
          reasoning: "ReasoningItemInputItem"
          item_reference: "ItemReferenceParamInputItem"
          local_shell_call: "LocalShellInputItem"
          local_shell_call_output: "LocalShellOutputInputItem"
          image_generation_call: "ImageGenerationCallInputItem"
          code_interpreter_call: "CodeInterpreterCallInputItem"
    InputItemType:
      type: string
      enum:
        - message
        - file_search_call
        - function_call
        - function_call_output
        - web_search_call
        - computer_call
        - computer_call_output
        - reasoning
        - item_reference
        - local_shell_call
        - local_shell_call_output
        - image_generation_call
        - code_interpreter_call
      default: message

    MessageContentInput:
      oneOf:
        - $ref: '#/components/schemas/MessageContentTextInput'
        - $ref: '#/components/schemas/MessageContentItemsInput'

    MessageContentTextInput:
      type: object
      properties:
        value:
          type: string
      required:
        - value

    MessageContentItemsInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageContentInputItem"
      required:
        - items

    MessageInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/MessageRole'
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
            content:
              $ref: '#/components/schemas/MessageContentInput'
          required:
            - role
            - content
    MessageContentInputItem:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/MessageInputItemContentType'
      discriminator:
        propertyName: type
        mapping:
          input_text: "MessageInputTextInputItemContent"
          input_image: "MessageInputImageInputItemContent"
          input_file: "MessageInputFileInputItemContent"
          output_text: "MessageOutputTextInputItemContent"
          refusal: "MessageRefusalInputItemContent"
    MessageInputItemContentType:
      type: string
      enum:
        - input_text
        - input_image
        - input_file
        - output_text
        - refusal
    MessageInputTextInputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentInputItem'
        - type: object
          properties:
            text:
              type: string
          required:
            - type
            - text
    MessageInputImageInputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentInputItem'
        - type: object
          properties:
            image_url:
              type: string
            file_id:
              type: string
            detail:
              $ref: '#/components/schemas/ImageDetailLevel'
          required:
            - type
    ImageDetailLevel:
      type: string
      enum:
        - high
        - low
        - auto
    MessageInputFileInputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentInputItem'
        - type: object
          properties:
            file_id:
              type: string
            filename:
              type: string
            file_data:
              type: string
          required:
            - type
    MessageOutputTextInputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentInputItem'
        - type: object
          properties:
            text:
              type: string
            annotations:
              items:
                $ref: "#/components/schemas/Annotation"
              type: array
          required:
            - type
            - text
    MessageRefusalInputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentInputItem'
        - type: object
          properties:
            refusal:
              type: string
          required:
            - type
            - refusal


    ItemReferenceParamInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - properties:
            id:
              type: string
          type: object
          required:
            - id
            - type
    LocalShellInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            call_id:
              type: string
            action:
              $ref: '#/components/schemas/LocalShellAction'
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
            - call_id
            - type
            - action
            - status
    LocalShellOutputInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            output:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
            - output
            - type
    ImageGenerationCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            result:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
            - status
            - type
    CodeInterpreterCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            code:
              type: string
            container_id:
              type: string
            results:
              type: array
              items:
                $ref: "#/components/schemas/CodeInterpreterResult"
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
            - status
            - type
            - results
            - code
    CodeInterpreterResult:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/CodeInterpreterResultType'
      discriminator:
        propertyName: type
        mapping:
          logs: "CodeInterpreterTextResult"
          files: "CodeInterpreterFilesResult"
    CodeInterpreterResultType:
      type: string
      enum:
        - logs
        - files
    CodeInterpreterTextResult:
      type: object
      allOf:
        - $ref: '#/components/schemas/CodeInterpreterResult'
        - properties:
            logs:
              type: string
          type: object
          required:
            - logs
            - type
    CodeInterpreterFilesResult:
      type: object
      allOf:
        - $ref: '#/components/schemas/CodeInterpreterResult'
        - properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/CodeInterpreterFile"
          type: object
          required:
            - logs
            - type
    CodeInterpreterFile:
      type: object
      properties:
        file_id:
          type: string
        mime_type:
          type: string
      required:
        - file_id
        - mime_type
    FileSearchResponsesApiToolCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - properties:
            id:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - searching
                - completed
                - incomplete
                - failed
            queries:
              type: array
              items:
                type: string
            results:
              type: array
              items:
                type: object
                properties:
                  file_id:
                    type: string
                  text:
                    type: string
                  filename:
                    type: string
                  attributes:
                    type: object
                  score:
                    type: number
                    format: double
          type: object
          required:
            - id
            - type
            - status
            - queries
    FunctionResponsesApiToolCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - properties:
            id:
              type: string
            call_id:
              type: string
            name:
              type: string
            arguments:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          type: object
          required:
            - type
            - call_id
            - name
            - arguments
    WebSearchResponsesApiToolCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - properties:
            id:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - searching
                - completed
                - failed
          type: object
          required:
            - id
            - type
            - status
    ComputerResponsesApiToolCallInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            call_id:
              type: string
            action:
              $ref: "#/components/schemas/ComputerAction"
            pending_safety_checks:
              type: array
              items:
                $ref: "#/components/schemas/ComputerResponsesApiToolCallSafetyCheck"
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - type
            - id
            - action
            - call_id
            - pending_safety_checks
            - status
    ReasoningItemInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            summary:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - summary_text
                  text:
                    type: string
                required:
                  - type
                  - text
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
            - summary
            - type
    ComputerCallOutputItemParamInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - type: object
          properties:
            id:
              type: string
            call_id:
              type: string
            output:
              $ref: "#/components/schemas/ComputerCallOutput"
            acknowledged_safety_checks:
              items:
                $ref: "#/components/schemas/ComputerCallSafetyCheckParam"
              type: array
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - call_id
            - type
            - output
    ComputerCallOutput:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ComputerCallOutputType'
      discriminator:
        propertyName: type
        mapping:
          computer_screenshot: "ComputerScreenshotImage"
    ComputerCallOutputType:
      type: string
      enum:
        - computer_screenshot
    ComputerScreenshotImage:
      type: object
      allOf:
        - $ref: '#/components/schemas/ComputerCallOutput'
        - type: object
          properties:
            image_url:
              type: string
            file_id:
              type: string
          required:
            - type
    ComputerCallSafetyCheckParam:
      properties:
        id:
          type: string
        code:
          type: string
        message:
          type: string
      type: object
      required:
        - id
    FunctionCallOutputItemParamInputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/InputItem'
        - properties:
            id:
              type: string
            call_id:
              type: string
            output:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          type: object
          required:
            - call_id
            - type
            - output


    OutputItem:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/OutputItemType'
      discriminator:
        propertyName: type
        mapping:
          message: "MessageOutputItem"
          file_search_call: "FileSearchResponsesApiToolCallOutputItem"
          computer_call: "ComputerResponsesApiToolCallOutputItem"
          web_search_call: "WebSearchResponsesApiToolCallOutputItem"
          function_call: "FunctionResponsesApiToolCallOutputItem"
          reasoning: "ReasoningItemOutputItem"
          local_shell_call: "LocalShellOutputItem"
          image_generation_call: "ImageGenerationOutputItem"
          code_interpreter_call: "CodeInterpreterOutputItem"
    OutputItemType:
      type: string
      enum:
        - message
        - file_search_call
        - function_call
        - web_search_call
        - computer_call
        - reasoning
        - local_shell_call
        - image_generation_call
        - code_interpreter_call
    CodeInterpreterOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - properties:
            id:
              type: string
            code:
              type: string
            container_id:
              type: string
            results:
              type: array
              items:
                $ref: "#/components/schemas/CodeInterpreterResponsesApiToolOutput"
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          type: object
          required:
            - type
            - status
    CodeInterpreterContainerType:
      type: string
      enum:
        - auto
    ImageGenerationOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - properties:
            id:
              type: string
            result:
              type: string
            quality:
              $ref: '#/components/schemas/ImageGenerationQuality'
            size:
              $ref: '#/components/schemas/ImageGenerationSize'
            background:
              $ref: '#/components/schemas/ImageGenerationBackground'
            output_format:
              $ref: '#/components/schemas/ImageGenerationOutputFormat'
            revised_prompt:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          type: object
          required:
            - type
            - status
    MessageOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - type: object
          properties:
            role:
              $ref: '#/components/schemas/MessageRole'
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
            content:
              type: array
              items:
                $ref: "#/components/schemas/MessageContentOutputItem"
          required:
            - role
            - content
    MessageContentOutputItem:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/MessageOutputItemContentType'
      discriminator:
        propertyName: type
        mapping:
          output_text: "MessageOutputTextOutputItemContent"
          refusal: "MessageRefusalOutputItemContent"
    MessageOutputItemContentType:
      type: string
      enum:
        - output_text
        - refusal
    MessageOutputTextOutputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentOutputItem'
        - type: object
          properties:
            text:
              type: string
            annotations:
              items:
                $ref: "#/components/schemas/Annotation"
              type: array
          required:
            - type
            - text
    MessageRefusalOutputItemContent:
      allOf:
        - $ref: '#/components/schemas/MessageContentOutputItem'
        - type: object
          properties:
            refusal:
              type: string
          required:
            - type
            - refusal
    FileSearchResponsesApiToolCallOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - properties:
            id:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - searching
                - completed
                - incomplete
                - failed
            queries:
              type: array
              items:
                type: string
            results:
              type: array
              items:
                type: object
                properties:
                  file_id:
                    type: string
                  text:
                    type: string
                  filename:
                    type: string
                  attributes:
                    type: object
                  score:
                    type: number
                    format: double
          type: object
          required:
            - id
            - type
            - status
            - queries
    FunctionResponsesApiToolCallOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - properties:
            id:
              type: string
            call_id:
              type: string
            name:
              type: string
            arguments:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          type: object
          required:
            - type
            - call_id
            - name
            - arguments
    WebSearchResponsesApiToolCallOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - properties:
            id:
              type: string
            status:
              type: string
              enum:
                - in_progress
                - searching
                - completed
                - failed
          type: object
          required:
            - id
            - type
            - status
    ComputerResponsesApiToolCallOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - type: object
          properties:
            id:
              type: string
            call_id:
              type: string
            action:
              $ref: "#/components/schemas/ComputerAction"
            pending_safety_checks:
              type: array
              items:
                $ref: "#/components/schemas/ComputerResponsesApiToolCallSafetyCheck"
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - type
            - id
            - action
            - call_id
            - pending_safety_checks
            - status
    ReasoningItemOutputItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/OutputItem'
        - type: object
          properties:
            id:
              type: string
            summary:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - summary_text
                  text:
                    type: string
                required:
                  - type
                  - text
            status:
              type: string
              enum:
                - in_progress
                - completed
                - incomplete
          required:
            - id
